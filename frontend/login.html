<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | AI Interview Preparation System</title>
  <script>
    (function() {
      const theme = localStorage.getItem('app_theme') || 'dark';
      document.documentElement.setAttribute('data-theme', theme);
      if (theme === 'dark') document.documentElement.classList.add('dark');
      else document.documentElement.classList.remove('dark');
    })();
  </script>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/navbar.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>
  <div id="navbar-mount"></div>

  <main class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <h1>Sign In</h1>
        <p>Access your interview sessions and performance analytics</p>
      </div>

      <form class="auth-form" id="login-form">
        <div class="form-group">
          <label class="form-label" for="login-email">Email address</label>
          <input type="email" id="login-email" class="form-control" placeholder="name@company.com" required autocomplete="email">
        </div>

        <div class="form-group">
          <label class="form-label" for="login-password">Password</label>
          <div class="password-input-wrap">
            <input type="password" id="login-password" class="form-control" placeholder="Enter password" required autocomplete="current-password">
            <button type="button" class="password-toggle-btn" aria-label="Toggle password visibility">👁️</button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 0.5rem;">
          Sign In
        </button>
      </form>

      <div class="auth-footer">
        Don't have an account? <a href="signup.html" style="font-weight: 500;">Create an account</a>
      </div>
    </div>
  </main>

  <script src="js/libs/supabase.js"></script>
  <script>if (typeof window.supabase === 'undefined') { document.write('<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"><\/script>'); }</script>
  <script src="js/config.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/api.js"></script>
  <script src="js/navbar.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
