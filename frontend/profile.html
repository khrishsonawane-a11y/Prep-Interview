<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Candidate Profile | AI Interview Preparation System</title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/navbar.css">
  <link rel="stylesheet" href="css/profile.css">
</head>
<body>
  <div class="ambient-bg"></div>
  <div id="navbar-mount"></div>

  <main class="container profile-page">
    <div style="margin-bottom: 2rem;">
      <span class="badge badge-primary" style="margin-bottom: 0.5rem;">Account Settings</span>
      <h1>Candidate Profile</h1>
      <p>Manage your target job role preferences and review lifetime interview statistics</p>
    </div>

    <div class="profile-layout">
      <!-- Left Sidebar: Profile Card & Stats -->
      <div class="profile-sidebar-card">
        <div class="profile-avatar-large" id="profile-avatar-char">U</div>
        <h2 class="profile-name" id="profile-name-header">Candidate</h2>
        <div class="profile-email" id="profile-email-header">candidate@example.com</div>

        <div style="width: 100%; border-top: 1px solid var(--border-subtle); padding-top: 1.5rem; margin-top: 0.5rem; display: flex; flex-direction: column; gap: 1rem;">
          <div style="display: flex; justify-content: space-between;">
            <span style="color: var(--text-dim); font-size: 0.88rem;">Attempted</span>
            <span style="font-weight: 700;" id="profile-stat-attempted">0</span>
          </div>
          <div style="display: flex; justify-content: space-between;">
            <span style="color: var(--text-dim); font-size: 0.88rem;">Completed</span>
            <span style="font-weight: 700; color: #34d399;" id="profile-stat-completed">0</span>
          </div>
          <div style="display: flex; justify-content: space-between;">
            <span style="color: var(--text-dim); font-size: 0.88rem;">Average Score</span>
            <span style="font-weight: 700; color: #60a5fa;" id="profile-stat-avg">0%</span>
          </div>
        </div>
      </div>

      <!-- Right: Editable Profile Form -->
      <div class="profile-form-card">
        <h3 style="margin-bottom: 1.5rem;">Edit Profile Information</h3>

        <form id="profile-edit-form" style="display: flex; flex-direction: column; gap: 1.25rem;">
          <div class="form-group">
            <label class="form-label" for="edit-name">Full Name</label>
            <input type="text" id="edit-name" class="form-control" placeholder="Jane Doe" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="edit-target-role">Primary Target Role</label>
            <select id="edit-target-role" class="form-control">
              <option value="Software Developer">Software Developer</option>
              <option value="Full Stack Developer">Full Stack Developer</option>
              <option value="Frontend Developer">Frontend Developer</option>
              <option value="Backend Developer">Backend Developer</option>
              <option value="Java Developer">Java Developer</option>
              <option value="Python Developer">Python Developer</option>
              <option value="Application Developer">Application Developer</option>
              <option value="Web Developer">Web Developer</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label" for="edit-exp-level">Experience Level</label>
            <select id="edit-exp-level" class="form-control">
              <option value="Beginner">Beginner (0-1 yrs)</option>
              <option value="Intermediate">Intermediate (1-4 yrs)</option>
              <option value="Advanced">Advanced (5+ yrs / Lead)</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label" for="edit-bio">Professional Bio & Focus Areas</label>
            <textarea id="edit-bio" class="form-control" placeholder="Share your technical interests, favorite frameworks, or interview goals..."></textarea>
          </div>

          <div style="display: flex; justify-content: flex-end; margin-top: 0.5rem;">
            <button type="submit" class="btn btn-primary btn-lg">
              Save Profile Changes
            </button>
          </div>
        </form>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/api.js"></script>
  <script src="js/navbar.js"></script>
  <script src="js/profile.js"></script>
</body>
</html>
